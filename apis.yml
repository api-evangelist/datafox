name: DataFox
description: 'DataFox was a San Francisco company-intelligence and sales-prospecting startup, backed
  by GV among others, that used machine learning to collect and score signals about private and public
  companies (funding rounds, hiring, news, growth signals) and delivered them to sales and marketing
  teams through a web application, CRM integrations, and a company-data API. Oracle acquired DataFox
  and folded its company-and-signals data into the Oracle Cloud CX / Oracle Fusion Marketing stack.
  The independent product has been fully retired: as of this profile the datafox.com apex and www hosts
  are served from Oracle infrastructure and every path under www.datafox.com issues a blanket HTTP 301
  to Oracle marketing pages, while api.datafox.com and app.datafox.com resolve to a parked Oracle
  address that accepts no connections. There is no surviving DataFox developer portal, documentation,
  API reference, or specification to harvest, so this profile is retained as a historical/acquired
  company record rather than an active API provider.'
